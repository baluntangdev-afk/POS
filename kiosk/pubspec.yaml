name: pos_app
description: "A new Flutter project."
publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  dart_mappable: ^4.6.1
  decimal: ^3.2.4
  dio: ^5.9.0
  envied: ^1.3.2
  esc_pos_utils_plus: ^2.0.4
  fast_immutable_collections: ^11.1.0
  ffi: ^2.1.5
  file_picker: ^8.1.7
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  gap: ^3.0.1
  go_router: ^17.0.1
  hooks_riverpod: ^3.1.0
  image: ^4.7.2
  image_picker: ^1.1.2
  intl: any
  json_annotation: ^4.9.0
  mime: ^2.0.0
  multicast_dns: ^0.3.3
  permission_handler: ^11.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.5.4
  vector_graphics: ^1.1.19
  win32: ^5.15.0
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: ^2.10.5
  custom_lint: ^0.8.1
  dart_mappable_builder: ^4.6.3
  envied_generator: ^1.3.2
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.1.3
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/svg/
    - assets/images/png/
    - assets/fonts/

dependency_overrides:
  archive: ^4.0.7

flutter_gen:
  output: lib/gen/
  assets:
    enabled: true
    exclude:
      - assets/images/svg/.gitkeep
      - assets/fonts/.gitkeep
      - assets/images/png/.gitkeep
  integrations:
    flutter_svg: true
