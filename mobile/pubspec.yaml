name: mobile
description: Offline mobile POS application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.24.0
  drift_flutter: ^0.2.4

  # State management
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3

  # Navigation
  go_router: ^17.0.1

  # Models
  dart_mappable: ^4.6.1

  # Auth / Security
  bcrypt: ^1.1.3
  shared_preferences: ^2.5.4

  # CSV
  csv: ^6.0.0
  file_picker: ^8.1.2
  path_provider: ^2.1.5

  # Printing
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.0.0
  pdf: ^3.11.0
  printing: ^5.13.2
  share_plus: ^10.0.0

  # Charts
  fl_chart: ^0.69.2

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  gap: ^3.0.1
  cupertino_icons: ^1.0.8

  # Utils
  intl: any
  collection: ^1.19.1
  decimal: ^3.2.4
  path: ^1.9.0

dependency_overrides:
  path_provider_android: 2.2.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.12
  dart_mappable_builder: ^4.6.3
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
